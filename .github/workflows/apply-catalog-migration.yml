name: Apply catalog URL migration

on:
  push:
    branches:
      - restart/catalog-url-migration
    paths:
      - .github/workflows/apply-catalog-migration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: restart/catalog-url-migration

      - name: Apply exact source and test patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('webui/page/kpm_repo.js')
          source = source_path.read_text(encoding='utf-8')

          constants_old = """const DEFAULT_REPO_URL = 'https://raw.githubusercontent.com/Zhanfg/PatchNest-Kpms/main/kpm_repo.json';
          const REPOS_KEY = 'patchnest_repos';
          const SYSTEM_REPOS_PATH = '/data/adb/patchnest/repos.json';
          """
          constants_new = """const DEFAULT_REPO_URL = 'https://raw.githubusercontent.com/Zhanfg/PatchNest-Kpms/main/kpm_repo.json';
          const RETIRED_REPO_URLS = new Set([
              'https://raw.githubusercontent.com/Zhanfg/Kpm-Repo/main/kpm_repo.json',
              'https://raw.githubusercontent.com/Zhanfg/KPatch-Next-Module/main/kpm_repo.json',
          ]);
          const REPOS_KEY = 'patchnest_repos';
          const SYSTEM_REPOS_PATH = '/data/adb/patchnest/repos.json';

          function normalizeStoredRepos(repos) {
              const normalized = [];
              const seen = new Set();
              for (const repo of repos) {
                  if (!repo || typeof repo.url !== 'string') continue;
                  const originalUrl = repo.url.trim();
                  if (!originalUrl) continue;
                  const retired = RETIRED_REPO_URLS.has(originalUrl);
                  const url = retired ? DEFAULT_REPO_URL : originalUrl;
                  if (seen.has(url)) continue;
                  seen.add(url);
                  const name = retired
                      ? getString('repo_official')
                      : (typeof repo.name === 'string' && repo.name.trim()
                          ? repo.name.trim()
                          : 'Repository');
                  normalized.push({ url, name });
              }
              return normalized;
          }
          """
          if constants_old not in source:
              raise SystemExit('constants anchor not found')
          source = source.replace(constants_old, constants_new, 1)

          migration_old = """    const legacy = localStorage.getItem('patchnest_repo_url');
              if (legacy && !localStorage.getItem(REPOS_KEY)) {
                  const migrated = [{ url: legacy, name: 'Main' }];
                  localStorage.setItem(REPOS_KEY, JSON.stringify(migrated));
                  localStorage.removeItem('patchnest_repo_url');
              }
              try {
                  const parsed = JSON.parse(localStorage.getItem(REPOS_KEY) || 'null');
                  if (Array.isArray(parsed) && parsed.length > 0) return parsed;
              } catch (_) {}
          """
          migration_new = """    const legacy = localStorage.getItem('patchnest_repo_url');
              if (legacy && !localStorage.getItem(REPOS_KEY)) {
                  const migrated = normalizeStoredRepos([{ url: legacy, name: 'Main' }]);
                  localStorage.setItem(REPOS_KEY, JSON.stringify(migrated));
                  localStorage.removeItem('patchnest_repo_url');
              }
              try {
                  const parsed = JSON.parse(localStorage.getItem(REPOS_KEY) || 'null');
                  if (Array.isArray(parsed) && parsed.length > 0) {
                      const normalized = normalizeStoredRepos(parsed);
                      if (normalized.length > 0) {
                          const serialized = JSON.stringify(normalized);
                          if (serialized !== localStorage.getItem(REPOS_KEY)) {
                              localStorage.setItem(REPOS_KEY, serialized);
                          }
                          return normalized;
                      }
                  }
              } catch (_) {}
          """
          if migration_old not in source:
              raise SystemExit('migration anchor not found')
          source = source.replace(migration_old, migration_new, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('webui/test/kpm-repo-storage.test.js')
          tests = test_path.read_text(encoding='utf-8')
          anchor = """    it('getRepos handles broken JSON (SyntaxError) gracefully', () => {
                  localStorage.setItem(REPOS_KEY, '{bad json');
                  const repos = getRepos();
                  expect(repos[0].url).toBe(DEFAULT_URL);
              });
          """
          addition = anchor + """

              it('migrates the retired single Kpm-Repo URL to PatchNest-Kpms', () => {
                  localStorage.setItem(
                      'patchnest_repo_url',
                      'https://raw.githubusercontent.com/Zhanfg/Kpm-Repo/main/kpm_repo.json',
                  );
                  const repos = getRepos();
                  expect(repos).toEqual([{ url: DEFAULT_URL, name: 'repo_official' }]);
                  expect(localStorage.getItem('patchnest_repo_url')).toBeNull();
                  expect(JSON.parse(localStorage.getItem(REPOS_KEY))).toEqual(repos);
              });

              it('repairs retired URLs already stored in the multi-repo list', () => {
                  localStorage.setItem(REPOS_KEY, JSON.stringify([
                      {
                          url: 'https://raw.githubusercontent.com/Zhanfg/Kpm-Repo/main/kpm_repo.json',
                          name: 'Old main',
                      },
                      { url: DEFAULT_URL, name: 'Duplicate official' },
                      { url: 'https://example.com/custom.json', name: 'Custom' },
                  ]));
                  const repos = getRepos();
                  expect(repos).toEqual([
                      { url: DEFAULT_URL, name: 'repo_official' },
                      { url: 'https://example.com/custom.json', name: 'Custom' },
                  ]);
                  expect(JSON.parse(localStorage.getItem(REPOS_KEY))).toEqual(repos);
              });
          """
          if anchor not in tests:
              raise SystemExit('test anchor not found')
          tests = tests.replace(anchor, addition, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Commit migration and remove one-time workflow
        run: |
          set -euo pipefail
          rm .github/workflows/apply-catalog-migration.yml
          git config user.name patchnest-migration-bot
          git config user.email patchnest-migration-bot@users.noreply.github.com
          git add webui/page/kpm_repo.js webui/test/kpm-repo-storage.test.js .github/workflows/apply-catalog-migration.yml
          git commit -m "fix(kpm-repo): migrate retired catalog URLs"
          git push origin HEAD:restart/catalog-url-migration
